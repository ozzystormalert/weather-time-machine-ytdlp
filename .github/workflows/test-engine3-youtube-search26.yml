
name: Engine 3 - Expanded YouTube Search Test 26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expanded-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run YouTube Search Test 26
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube-search-test26.js

      - name: Save Test 26 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine3-test26-results
          path: engine3-test26-results.json
          if-no-files-found: warn
          retention-days: 30
