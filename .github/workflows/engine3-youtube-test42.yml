
name: Engine 3 - Historical Evidence Grading Test 42

on:
  workflow_dispatch:

jobs:
  evidence-grading:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Test 42
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node engine3-youtube-test42.js

      - name: Upload Test 42 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine3-youtube-test42-report
          path: |
            reports/engine3-youtube-test42.json
            reports/engine3-youtube-test42-review.md
          if-no-files-found: warn
