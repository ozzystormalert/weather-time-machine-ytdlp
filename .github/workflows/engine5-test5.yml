
name: Engine 5 - Historical Map Authenticity Test 5

on:
  workflow_dispatch:

jobs:
  authenticity-test:
    name: Engine 5 Test 5
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate Test 5 JavaScript
        shell: bash
        run: |
          echo "Locating Engine 5 Test 5 JavaScript..."

          if [ -f "engine5/engine5-map-authenticity-test5.js" ]; then
            echo "TEST5_SCRIPT=engine5/engine5-map-authenticity-test5.js" >> "$GITHUB_ENV"
            echo "Found JavaScript in engine5/"

          elif [ -f "engine5/engine5/engine5-map-authenticity-test5.js" ]; then
            echo "TEST5_SCRIPT=engine5/engine5/engine5-map-authenticity-test5.js" >> "$GITHUB_ENV"
            echo "Found JavaScript in engine5/engine5/"

          else
            echo "ERROR: Test 5 JavaScript file not found."
            echo "Available Engine 5 files:"
            find engine5 -maxdepth 3 -type f -print
            exit 1
          fi

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          echo "Checking JavaScript syntax..."
          node --check "$TEST5_SCRIPT"

      - name: Run Test 5
        shell: bash
        run: |
          echo "Running Engine 5 Historical Map Authenticity Test 5..."
          node "$TEST5_SCRIPT"

      - name: Upload Test 5 Evidence Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine5-test5-evidence-report
          path: engine5-test5-results.json
          if-no-files-found: warn
          retention-days: 30
