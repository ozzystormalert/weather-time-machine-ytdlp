name: Engine 3 - Bing Video and Web Test 35

on:
  workflow_dispatch:

jobs:
  bing-test35:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Engine 3 Test 35
        env:
          WEATHER_STATE: New Jersey
          WEATHER_YEAR: '2012'
          WEATHER_EVENT: Hurricane Sandy
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node engine3-bing-test35.js
      - name: Upload Test 35 JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine3-bing-test35-report
          path: reports/engine3-bing-test35.json
          if-no-files-found: warn
