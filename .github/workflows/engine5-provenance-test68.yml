
name: Engine 5 - Provenance Test 6.8

on:
  workflow_dispatch:

jobs:
  provenance-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Engine 5 Provenance Test 6.8
        env:
          EVENT: Superstorm Sandy
          STATE: New Jersey
          YEAR: '2012'
          ENGINE5_URL: https://weather-time-machine-engine5.onrender.com
        run: node engine5/engine5-provenance-v68.js

      - name: Upload Test 6.8 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine5-v68-provenance-results
          path: engine5-v68-provenance-results.json
          if-no-files-found: warn
