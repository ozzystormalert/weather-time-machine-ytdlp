
name: Engine 3 - Final Blogger Acceptance Test 45

on:
  workflow_dispatch:

jobs:
  final-acceptance:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Test 45
        run: node engine3-blogger-test45.js

      - name: Upload Test 45 Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine3-youtube-test45-report
          path: |
            reports/engine3-test45-acceptance.json
            reports/engine3-test45-integration-preview.html
            reports/engine3-test45-summary.md
          if-no-files-found: warn
