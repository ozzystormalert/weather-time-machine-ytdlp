
name: Engine 3 - Independent Bing Test

'on':
  workflow_dispatch:
    inputs:
      weather_query:
        description: "Weather event, year, state, and news"
        required: true
        type: string
        default: "hurricane sandy 2012 new jersey news"

  push:
    paths:
      - '.github/workflows/test-engine3-bing.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WEATHER_QUERY: ${{ inputs.weather_query || 'blizzard 1978 illinois news' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Bing browser test
        run: node bing-browser-test.js
